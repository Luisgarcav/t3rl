[project]
name = "t3rl-worker"
version = "0.1.0"
description = "Optional Python runtime for T3RL experiments"
requires-python = ">=3.10,<3.14"
dependencies = ["gymnasium==1.3.0", "stable-baselines3==2.9.0"]

[project.optional-dependencies]
dev = []
llm = ["trl==1.10.0"]
# Axolotl pins exact versions that conflict with `llm`; install it into its own
# environment and point T3RL_PYTHON_AXOLOTL at that interpreter.
axolotl = ["axolotl==0.18.0"]
